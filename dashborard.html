<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0a0a;
color:white;
}

.top{
background:linear-gradient(90deg,gold,#ffcc00);
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
color:black;
box-shadow:0 0 20px gold;
}

.container{
padding:20px;
}

.card{
background:#111;
padding:20px;
margin-top:20px;
border-radius:20px;
box-shadow:0 0 15px gold;
}

h2{
color:gold;
}

.rank{
font-size:22px;
color:#00ff99;
font-weight:bold;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:gold;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:white;
}

</style>

</head>

<body>

<div class="top">
👑 Empire Community Dashboard
</div>

<div class="container">

<div class="card">
<h2>Welcome Back 👑</h2>

<p><b>Username:</b> @empire_member</p>

<p><b>Empire Rank:</b></p>

<p class="rank">🔥 Active Member</p>

<p><b>Referral Members:</b> 0</p>

<p><b>Next Rank Target:</b> Add 3 Members 🚀</p>

<button>Invite Members</button>

</div>

<div class="card">

<h2>Empire Benefits 🚀</h2>

<p>✅ Premium Community</p>

<p>✅ Weekly Meetings</p>

<p>✅ Rank System</p>

<p>✅ Referral Rewards</p>

<p>✅ Leadership Access</p>

</div>

</div>

</body>
</html>
