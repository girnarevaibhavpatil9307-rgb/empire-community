<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empire Community</title>

<style>
body{
margin:0;
padding:0;
font-family:Arial;
background:linear-gradient(135deg,#000,#1a1a1a);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.box{
width:350px;
padding:30px;
background:#111;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px gold;
}

h1{
color:gold;
font-size:32px;
}

input{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:10px;
background:gold;
color:black;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:white;
}

p{
color:#ccc;
}
</style>
</head>

<body>

<div class="box">
<h1>👑 Empire Community</h1>

<p>From Members To Leaders 🚀</p>

<input type="text" placeholder="Enter Empire ID">

<input type="password" placeholder="Enter Password">

<button onclick="window.location.href='dashboard.html'">Login</button>

<script>
function showDashboard(){
  document.body.innerHTML = `
  <div style="padding:20px;color:white;background:#0a0a0a;min-height:100vh;font-family:Arial;">
    <div style="background:gold;color:black;padding:20px;text-align:center;font-size:28px;font-weight:bold;">
      👑 Empire Community Dashboard
    </div>

    <div style="background:#111;margin-top:25px;padding:20px;border-radius:20px;box-shadow:0 0 20px gold;">
      <h2 style="color:gold;">Welcome Back 👑</h2>
      <p><b>Username:</b> @empire_member</p>
      <p><b>Empire Rank:</b> 🔥 Active Member</p>
      <p><b>Referral Members:</b> 0</p>
      <p><b>Next Rank:</b> Add 3 Members 🚀</p>
      <button style="width:100%;padding:15px;background:gold;border:none;border-radius:12px;font-weight:bold;">
        Invite Members
      </button>
    </div>
  </div>`;
}
</script>
